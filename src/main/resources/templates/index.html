<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de Contatos</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
  <h1>Agenda de Contatos</h1>
  <form th:action="@{/add}" method="post">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" required>
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" required>
    <label for="email">E-mail (opcional)</label>
    <input id="email" type="email" name="email">
    <button type="submit">Salvar contato</button>
  </form>
  <hr style="margin:24px 0;border:0;border-top:1px solid #eee">
  <form class="linha" th:action="@{/}" method="get">
    <input name="q" placeholder="Buscar por nome" th:value="${q}">
    <button type="submit">Buscar</button>
  </form>
  <ul>
    <li th:each="c : ${contatos}">
      <div>
        <strong th:text="${c.nome}"></strong><br>
        <small th:text="${c.telefone}"></small>
        <small th:if="${!#strings.isEmpty(c.email)}" th:text="${' - ' + c.email}"></small>
      </div>
      <form th:action="@{/remove/{id}(id=${c.id})}" method="post" style="margin-left:auto">
        <button type="submit" title="Remover">&#10005;</button>
      </form>
    </li>
  </ul>
  <small th:if="${#lists.isEmpty(contatos)}">Nenhum contato encontrado.</small>
</main>
</body>
</html>
